<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: a match record. Masthead with the resolution and the bench, a sticky rundown of the 11
   segments, speeches offset left (Pro) and right (Con) like a flow sheet, crossfire as a dialogue,
   then the panel's decision and the evidence file. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --line: #dce1e9;
  --ink: #18202c;
  --muted: #5d687a;
  --pro: #2c5bc9;
  --pro-soft: #e6ecfa;
  --con: #bb420f;
  --con-soft: #fbebe2;
  --ok: #17753a;
  --ok-soft: #e3f3e8;
  --warn: #9a5b06;
  --warn-soft: #fbf0d6;
  --display: "Source Serif 4", "Noto Serif SC", "Songti SC", Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131a; --surface: #171c25; --surface-2: #1f2530; --line: #2b3240; --ink: #e5e9f0; --muted: #97a1b2;
    --pro: #86a8ff; --pro-soft: #1c2844; --con: #f59a62; --con-soft: #37241a;
    --ok: #5fd08a; --ok-soft: #173024; --warn: #f2bd57; --warn-soft: #362c14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #171c25; --surface-2: #1f2530; --line: #2b3240; --ink: #e5e9f0; --muted: #97a1b2;
  --pro: #86a8ff; --pro-soft: #1c2844; --con: #f59a62; --con-soft: #37241a;
  --ok: #5fd08a; --ok-soft: #173024; --warn: #f2bd57; --warn-soft: #362c14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--body); }
a { color: inherit; }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--pro); outline-offset: 2px; border-radius: 4px; }

.page { max-width: 1100px; margin: 0 auto; padding-inline: 24px; padding-block: 32px 96px; display: flex; flex-direction: column; gap: 28px; }
@media (max-width: 640px) { .page { padding-inline: 16px; padding-block: 20px 64px; gap: 20px; } }

/* Masthead */
.masthead { display: flex; flex-direction: column; gap: 18px; }
.eyebrow { margin: 0; font: 600 12px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 700 clamp(1.55rem, 3.6vw, 2.35rem)/1.3 var(--display); text-wrap: balance; letter-spacing: -0.005em; }
.bench { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.team.con { text-align: right; }
.team-name { font: 700 1.1rem/1.3 var(--display); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.team.pro .team-name { color: var(--pro); }
.team.con .team-name { color: var(--con); justify-content: flex-end; }
.team ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.team li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.team.con li { justify-content: flex-end; }
.team .name { font-weight: 600; }
.persona { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.vs { align-self: center; font: 600 13px var(--mono); color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
@media (max-width: 640px) {
  .bench { grid-template-columns: 1fr; gap: 8px; }
  .team.con { text-align: left; }
  .team.con .team-name, .team.con li { justify-content: flex-start; }
  .vs { justify-self: center; }
}
.verdict { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; padding: 14px 18px; border-radius: var(--radius); background: var(--surface-2); }
.verdict.pro { background: var(--pro-soft); }
.verdict.con { background: var(--con-soft); }
.verdict-main { font: 700 1.5rem/1.2 var(--display); }
.verdict.pro .verdict-main, .verdict.pro .verdict-score { color: var(--pro); }
.verdict.con .verdict-main, .verdict.con .verdict-score { color: var(--con); }
.verdict-score { font: 700 1.5rem/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.verdict-top { color: var(--muted); font-size: 14px; }
.verdict.pending { color: var(--muted); }

/* Rundown */
.rundown { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px; margin-inline: -2px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); scrollbar-width: thin; }
.rd { flex: none; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.rd span { font: 600 11px var(--mono); color: var(--muted); }
.rd.pro { box-shadow: inset 0 -2px 0 var(--pro); }
.rd.con { box-shadow: inset 0 -2px 0 var(--con); }
.rd.missing { opacity: 0.45; }
.rd.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rd.active span { color: inherit; }

/* Transcript */
.transcript { display: flex; flex-direction: column; gap: 20px; }
.segment { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; scroll-margin-top: 64px; min-width: 0; }
.speech { width: min(100%, 800px); }
@media (min-width: 900px) { .speech.pro { margin-right: auto; } .speech.con { margin-left: auto; } }
.seg-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.speech.pro .seg-head { background: var(--pro-soft); }
.speech.con .seg-head { background: var(--con-soft); }
.crossfire .seg-head { background: var(--surface-2); }
.seg-n { font: 600 12px var(--mono); color: var(--muted); }
.seg-head h2 { margin: 0; font: 700 1.02rem/1.4 var(--body); }
.speech.pro .seg-head h2 { color: var(--pro); }
.speech.con .seg-head h2 { color: var(--con); }
.seg-who { color: var(--muted); font-size: 14px; }
.clock { margin-left: auto; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.clock.over { color: var(--warn); }

.prose { padding: 16px 20px 18px; font-size: 16px; line-height: 1.85; }
.prose.small { padding: 0; font-size: 14.5px; line-height: 1.75; }
.prose > * { margin: 0; }
.prose > * + * { margin-top: 0.8em; }
.prose h3, .prose h4, .prose h5 { font-size: 1rem; line-height: 1.5; margin-top: 1.2em; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose blockquote { margin-inline: 0; padding: 8px 14px; background: var(--surface-2); border-radius: 8px; color: var(--muted); }
.prose code { font: 0.9em var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.prose hr { border: 0; border-top: 1px solid var(--line); }

a.ref { display: inline-block; vertical-align: 0.4em; margin: 0 1px; padding: 0 5px; font: 600 10.5px/1.6 var(--mono); border-radius: 4px; text-decoration: none; }
a.ref.pro { color: var(--pro); background: var(--pro-soft); }
a.ref.con { color: var(--con); background: var(--con-soft); }
.cites a.ref { vertical-align: baseline; }

.cites { padding: 12px 20px 16px; border-top: 1px dashed var(--line); }
.cites h3 { margin: 0 0 6px; font: 600 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cites ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.cites li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }

/* Crossfire */
.exchange { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 18px; }
.turn { display: flex; flex-direction: column; gap: 3px; max-width: min(78%, 640px); min-width: 0; }
.turn.pro { align-self: flex-start; }
.turn.con { align-self: flex-end; align-items: flex-end; }
.turn.neutral { align-self: center; max-width: 100%; color: var(--muted); font-size: 14px; }
.turn .who { font-size: 12px; font-weight: 600; }
.turn.pro .who { color: var(--pro); }
.turn.con .who { color: var(--con); }
.bubble { padding: 9px 13px; border-radius: 12px; font-size: 15px; line-height: 1.75; }
.bubble > * { margin: 0; }
.bubble > * + * { margin-top: 0.5em; }
.turn.pro .bubble { background: var(--pro-soft); border-top-left-radius: 4px; }
.turn.con .bubble { background: var(--con-soft); border-top-right-radius: 4px; }
@media (max-width: 640px) { .turn { max-width: 92%; } }

/* Decision */
.section-title { margin: 12px 0 0; font: 700 1.6rem/1.3 var(--display); scroll-margin-top: 64px; }
.sub-title { margin: 22px 0 10px; font: 700 1.05rem/1.4 var(--body); display: flex; align-items: center; gap: 8px; }
.decision, .evidence { scroll-margin-top: 64px; }
.decision-text { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 14px; }
.decision-text h2, .decision-text h3 { font: 700 1.1rem/1.4 var(--display); margin-top: 1.4em; }
.decision-text > h2:first-child, .decision-text > h3:first-child { margin-top: 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
td.strong { font-weight: 700; }
table.points { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); border-collapse: separate; border-spacing: 0; overflow: hidden; }
table.points tbody tr:last-child > * { border-bottom: 0; }
table.points th[scope="row"] { white-space: nowrap; font-weight: 600; }
table.points tr.top { background: var(--warn-soft); }
table.points tr.top th::after { content: " ★"; color: var(--warn); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; flex: none; }
.dot.pro { background: var(--pro); }
.dot.con { background: var(--con); }
.speaker-notes { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.speaker-notes summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.speaker-notes ul { margin: 8px 0 4px; padding-left: 1.2em; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

.ballots { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.ballot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ballot header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ballot h3 { margin: 0; font: 700 1rem/1.4 var(--display); }
.judge-style { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.ballot h4 { margin: 8px 0 0; font: 600 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.clashes { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.clash-title { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.clash-body { color: var(--muted); line-height: 1.7; margin-top: 2px; }
.clash-body > * { margin: 0; }
.ev-notes { font-size: 13.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.ev-notes > * { margin: 0; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.5; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; text-decoration: none; font-weight: 500; }
.chip.pro { background: var(--pro-soft); color: var(--pro); }
.chip.con { background: var(--con-soft); color: var(--con); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.used { background: var(--surface-2); color: var(--ink); }
.chip.big { font-size: 14px; font-weight: 700; padding: 3px 12px; }

/* Evidence */
.ev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 820px) { .ev-grid { grid-template-columns: 1fr; } }
.ev-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ev-col .sub-title { margin: 8px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 64px; min-width: 0; }
.card.unused { opacity: 0.72; }
.card:target { outline: 2px solid var(--ink); outline-offset: 2px; }
.card header { display: flex; gap: 10px; align-items: baseline; }
.card-id { font: 700 13px var(--mono); flex: none; }
.card.pro .card-id { color: var(--pro); }
.card.con .card-id { color: var(--con); }
.claim { margin: 0; font-weight: 600; }
.src { margin: 0; font-size: 13px; color: var(--muted); }
.card blockquote { margin: 0; padding: 10px 14px; background: var(--surface-2); border-radius: 8px; font: 15px/1.75 var(--display); overflow-wrap: anywhere; }
.card footer { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.card footer > a:first-child { color: var(--muted); overflow-wrap: anywhere; }
</style>

<script>
(function () {
  try {
    var chips = {};
    document.querySelectorAll(".rundown a").forEach(function (a) { chips[a.getAttribute("href").slice(1)] = a; });
    var targets = Array.prototype.filter.call(document.querySelectorAll(".segment, #decision, #evidence"), function (el) { return chips[el.id]; });
    if (!("IntersectionObserver" in window) || !targets.length) return;
    var current = null;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        var chip = chips[e.target.id];
        if (!chip || chip === current) return;
        if (current) current.classList.remove("active");
        chip.classList.add("active");
        current = chip;
        var nav = chip.parentElement;
        nav.scrollTo({ left: chip.offsetLeft - nav.clientWidth / 2 + chip.clientWidth / 2, behavior: "auto" });
      });
    }, { rootMargin: "-30% 0px -60% 0px" });
    targets.forEach(function (t) { io.observe(t); });
  } catch (err) { /* navigation highlight is optional */ }
})();
</script>
